name: Hourly AI Rankings & Failover

on:
  schedule:
    - cron: '0 * * * *' # Revisión cada 1 hora: respalda datos y actúa como failover automático si el bot 24/7 cae
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  scrape-and-update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Check if 24/7 Bot is Awake (Smart Failover)
        id: bot_check
        env:
          BOT_URL: ${{ secrets.BOT_URL }}
        run: |
          if [ -n "$BOT_URL" ] && curl --fail --silent --location --max-time 15 "${BOT_URL%/}/health" >/dev/null; then
            echo "✅ Bot 24/7 activo en $BOT_URL: ejecutando solo respaldo silencioso (sin duplicar alertas)."
            echo "skip_broadcast=1" >> "$GITHUB_OUTPUT"
          else
            echo "🛡️ Bot externo no alcanzado o BOT_URL vacía: GitHub Actions enviará alertas si hay cambios."
            echo "skip_broadcast=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Hourly Scraper
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PUBLIC_CHANNEL_ID: ${{ secrets.PUBLIC_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          SKIP_TELEGRAM_BROADCAST: ${{ steps.bot_check.outputs.skip_broadcast }}
        run: python -m src.update_data

      - name: Commit and push JSON snapshot to data branch
        run: |
          git config --global user.name "RankingAI Bot"
          git config --global user.email "bot@rankingai.com"
          cp data/rankings.json /tmp/rankings.json
          git fetch origin +refs/heads/data:refs/remotes/origin/data || true
          if git rev-parse --verify refs/remotes/origin/data >/dev/null 2>&1; then
            git checkout -B data refs/remotes/origin/data
          else
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data
          cp /tmp/rankings.json data/rankings.json
          git rm -f --ignore-unmatch data/rankings.db || true
          git add -f data/rankings.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "🔄 Actualización horaria automática de rankings"
            git push origin HEAD:refs/heads/data || git push --force-with-lease origin HEAD:refs/heads/data
          fi
