name: Keep Bot Alive

on:
  schedule:
    - cron: '*/10 * * * *' # Cada 10 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
    - name: Ping Bot URL
      env:
        BOT_URL: ${{ secrets.BOT_URL }}
      run: |
        if [ -z "$BOT_URL" ]; then
          echo "⚠️ BOT_URL no configurada en los secrets del repositorio."
          exit 0
        fi
        curl -s -f "$BOT_URL/health" || echo "⚠️ El bot no respondió al ping de salud."
