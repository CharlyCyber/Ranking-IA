[project]
name = "ranking-ai-agent"
version = "4.0.0"
description = "Agente y plataforma pública gratuita de monitorización de rankings, precios y tendencias de modelos de IA"
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"
# .kilocode aloja scripts vendorizados del editor: no son código de este proyecto.
extend-exclude = ["__pycache__", ".ruff_cache", "data", ".kilocode"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
